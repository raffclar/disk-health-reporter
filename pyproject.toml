[project]
name = "disk-health-reporter"
version = "0.1.0"
description = "CLI tool to collect and email S.M.A.R.T. statistics from block devices"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "gavxn", email = "gavxn@zanidrak.com" }
]
dependencies = [
    "jinja2>=3.1.2",
    "rich>=13.3.2",
]

[project.scripts]
disk-health-reporter = "disk_health_reporter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["disk_health_reporter"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203", "E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["disk_health_reporter"]

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]
